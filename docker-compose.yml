version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: sporaclet-db
    environment:
      POSTGRES_USER: sporaclet
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: sporaclet_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sporaclet"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sporaclet-network

  redis:
    image: redis:7-alpine
    container_name: sporaclet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sporaclet-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  sporaclet-network:
    driver: bridge
