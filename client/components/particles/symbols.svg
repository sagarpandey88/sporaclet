<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Simple stylized ball symbols using CSS variables for colors -->
  <symbol id="ball-small" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="var(--particle-accent)" />
    <path d="M4 12c4-2 8-2 16 0" stroke="var(--particle-accent-2)" stroke-width="1.2" fill="none" opacity="0.9" />
  </symbol>

  <symbol id="ball-medium" viewBox="0 0 32 32">
    <circle cx="16" cy="16" r="14" fill="var(--particle-accent)" />
    <path d="M6 16c6-3 12-3 20 0" stroke="var(--particle-accent-2)" stroke-width="1.6" fill="none" opacity="0.9" />
  </symbol>

  <symbol id="ball-large" viewBox="0 0 40 40">
    <circle cx="20" cy="20" r="18" fill="var(--particle-accent)" />
    <path d="M8 20c8-4 16-4 32 0" stroke="var(--particle-accent-2)" stroke-width="2" fill="none" opacity="0.9" />
  </symbol>

  <symbol id="dot" viewBox="0 0 6 6">
    <circle cx="3" cy="3" r="3" fill="var(--particle-dot)" />
  </symbol>
</svg>
